components:
  schemas:
    AirportCitySchema:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: vukovar
        flag_url:
          type: string
          example: https://live.staticflickr.com/65535/53499754431_6632e3c5c0_o.png
        is_in_croatia:
          type: boolean
          example: true
        banner_image_url:
          type: string
          nullable: true
          example: https://example.com/zagreb-airport.jpg
        is_active:
          type: boolean
          example: true
        display_order:
          type: integer
          nullable: true
          example: 10

    GetAllAirportCitiesResponse:
      type: array
      items:
        $ref: "#/components/schemas/AirportCitySchema"

    AirportCitiesNotFoundErrorResponse:
      properties:
        error:
          type: string
          example: No airport cities found
